# Cloudflare Worker - recovery notifier. Deploy with `wrangler deploy` from this folder.
# See README.md for first-time setup: KV namespace, secrets, sender, and list id.
name = "iscodexup-notifier"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Cron: every minute. Cloudflare's smallest interval.
[triggers]
crons = ["* * * * *"]

# Created with: wrangler kv namespace create iscodexup_STATE  (title must be unique per
# account — isclaudeup already owns "STATE"). Binding stays "STATE" (worker uses env.STATE).
[[kv_namespaces]]
binding = "STATE"
id = "78f8d0b3c68a45d895345cd79309500f"

[vars]
STATUS_URL = "https://status.openai.com/api/v2/summary.json"

# OpenAI exposes ~25 services. Recovery email state is scoped to these components.
#
# ⚠ MUST match OpenAI's published component names exactly (case-insensitive), and they
# rename/retire components without notice. Keep this in sync with config.js `components.include`.
# The previous value ("Codex API,CLI,VS Code extension,Login,Realtime") matched no Codex
# component at all, so a Codex outage could never fire a recovery email. The worker now
# logs a warning for every name it can't find — check `wrangler tail` after a deploy.
#
# Re-check live names:
#   curl -s https://status.openai.com/api/v2/summary.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>JSON.parse(s).components.forEach(c=>console.log(c.name)))"
COMPONENT_INCLUDE = "Codex in ChatGPT Desktop,Responses,Login"

# Codex notify list (Brevo → Contacts → Lists → "iscodexup", id 10).
BREVO_LIST_ID = "10"
SENDER_NAME = "Is Codex Up"
# iscodexup.com is authenticated in Brevo (DKIM + DMARC verified 2026-08-20).
SENDER_EMAIL = "notify@iscodexup.com"

PRODUCT = "Codex"
SITE_URL = "https://iscodexup.com"

# Only major component issues trigger a recovery email. Minor/degraded blips are shown
# on the site but do not send a recovery blast unless you add "minor" here.
OUTAGE_INDICATORS = "major,critical"
MIN_OUTAGE_MINUTES = "3"
UP_CONFIRM_TICKS = "2"
NOTIFY_COOLDOWN_MINUTES = "180"

# Secrets, set with `wrangler secret put`:
#   BREVO_API_KEY
#   ADMIN_KEY
