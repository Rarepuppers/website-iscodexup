# Cloudflare Worker - recovery notifier. Deploy with `wrangler deploy` from this folder.
# See README.md for first-time setup: KV namespace, secrets, sender, and list id.
name = "iscodexup-notifier"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Cron: every minute. Cloudflare's smallest interval.
[triggers]
crons = ["* * * * *"]

# Create with: wrangler kv namespace create STATE
# TODO(iscodexup): replace this with the new KV namespace id before deploying.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_NEW_KV_NAMESPACE_ID"

[vars]
STATUS_URL = "https://status.openai.com/api/v2/summary.json"

# OpenAI exposes many services. Recovery email state is scoped to these components.
COMPONENT_INCLUDE = "Codex API,CLI,VS Code extension,Login,Realtime"

# TODO(iscodexup): set the numeric id of the new Codex notify list in Brevo.
BREVO_LIST_ID = "REPLACE_WITH_CODEX_NOTIFY_LIST_ID"
SENDER_NAME = "Is Codex Up"
# TODO(iscodexup): authenticate iscodexup.com in Brevo before this sender works.
SENDER_EMAIL = "notify@iscodexup.com"

PRODUCT = "Codex"
SITE_URL = "https://iscodexup.com"

# Only major component issues trigger a recovery email. Minor/degraded blips are shown
# on the site but do not send a recovery blast unless you add "minor" here.
OUTAGE_INDICATORS = "major,critical"
MIN_OUTAGE_MINUTES = "3"
UP_CONFIRM_TICKS = "2"
NOTIFY_COOLDOWN_MINUTES = "180"

# Secrets, set with `wrangler secret put`:
#   BREVO_API_KEY
#   ADMIN_KEY
